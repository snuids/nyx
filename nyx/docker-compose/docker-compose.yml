version: '2'

volumes:
   node_red_data:
#   pgdata:

services:

#############################
  anaconda:
    image: snuids/anaconda:v0.0.3
    container_name: anacondab
    environment:
      - TZ=Europe/Paris        
    volumes:
      - ../reportrunnerold:/opt/notebooks/reportsold
      - ../reportrunner:/opt/notebooks/reports
      - ../camelworkers:/opt/notebooks/camelworkers
      - ../logs:/opt/notebooks/logs
      - ../elastalert/rules:/opt/notebooks/elastalert
      - ../notebooks:/opt/notebooks/notebooks
      - ..//backup:/opt/notebooks/backup

##############################
  nodered:
    image: nodered/node-red:4.0.9-22
    container_name: nodered
    volumes:
      - ../node_red_data:/data
#      - node_red_data:/data
#    environment:
#      - NODE_TLS_REJECT_UNAUTHORIZED=0
    environment:
      - TZ=Europe/Paris
      - PGHOST=postgres
      - PGDATABASE=nyx
      - PGPASSWORD=${PG_PASSWORD:?set PG_PASSWORD}
      - PGUSER=nyx

############################################################################################
  logioweb:
    hostname: air-logs
    container_name: logioweb
    image: 'blacklabelops/logio:latest'
    volumes:
      - '/opt/server'

#############################################################################################
  harvester:
    image: 'blacklabelops/logio:latest'
    container_name: harvester
    environment:
      - 'DELAYED_START=10'
      - 'LOGIO_HARVESTER_NODENAME=RPinumLogs'
      - 'LOGIO_HARVESTER1STREAMNAME=RestAPI' 
      - 'LOGIO_HARVESTER1LOGSTREAMS=/var/log/logs' 
      - 'LOGIO_HARVESTER1FILEPATTERN=RestAPIG.log'
      - 'LOGIO_HARVESTER2STREAMNAME=CamelWorker1'
      - 'LOGIO_HARVESTER2LOGSTREAMS=/var/log/logs'
      - 'LOGIO_HARVESTER2FILEPATTERN=camelworker1.log'
      - 'LOGIO_HARVESTER3STREAMNAME=ElastAlert'
      - 'LOGIO_HARVESTER3LOGSTREAMS=/var/log/logs'
      - 'LOGIO_HARVESTER3FILEPATTERN=ElastAlert.log'
      - 'LOGIO_HARVESTER4STREAMNAME=XLSImporter'
      - 'LOGIO_HARVESTER4LOGSTREAMS=/var/log/logs'
      - 'LOGIO_HARVESTER4FILEPATTERN=XLS_IMPORTER.log'
      - 'LOGIO_HARVESTER5STREAMNAME=ReportRunner1'
      - 'LOGIO_HARVESTER5LOGSTREAMS=/var/log/logs'
      - 'LOGIO_HARVESTER5FILEPATTERN=ReportRunner_1.log'
      - 'LOGIO_HARVESTER6STREAMNAME=Lambdas'
      - 'LOGIO_HARVESTER6LOGSTREAMS=/var/log/logs'
      - 'LOGIO_HARVESTER6FILEPATTERN=NYX_Lambda_2.log'
    volumes:
      - '../logs/:/var/log/logs/'
    links:
      - logioweb:logio
    user: root
    command: harvester

################################################################################################

  nyx_ui:
    # Built by nyx_ui/.github/workflows/build-container.yml (tags snuids/nyx_ui:vX.Y.Z)
    image: snuids/nyx_ui:v3.31.21
    container_name: nyx_ui
    restart: always

################################################################################################

  # Deprecated: snuids/nyx_mob is archived and its image is frozen at this tag. Kept so the
  # reference stack still describes the original platform; the running instance has no such service.
  nyx_mobile:
    image: snuids/nyx_mobile:v1.0.2
    ports:
      - 7654:7654
    container_name: nyx_mobile
    restart: always

################################################################################################

  nyx_restapi:
    # Built by nyx_rest/.github/workflows/build-container.yml (image snuids/nyx_rest, tags vX.Y.Z)
    image: snuids/nyx_rest:v3.22.20
    container_name: nyx_restapi
    command: gunicorn -b 0.0.0.0:8000 --log-config restapilog.conf -w 3 nyx_rest_api_plus:app
    restart: always
    environment:
      - REDIS_IP=redis
      - USE_LOGSTASH=true
      - AMQC_URL=amqc
      - AMQC_LOGIN=admin
      - AMQC_PASSWORD=${AMQC_PASSWORD:?set AMQC_PASSWORD}
      - AMQC_PORT=61613
      - ELK_URL=esnodebal
      - ELK_LOGIN=
      - ELK_PASSWORD=
      - ELK_PORT=9200
      - ELK_SSL=false
      - OUTPUT_FOLDER=./outputs/
      - OUTPUT_URL=https://test2.nyx-ds.com/generatedreports/rapi/
      - TZ=Europe/Paris
      - WELCOMEMESSAGE=LOCAL NYX Platform
      - ICON=vial

      - GRAFANA_URL=${GRAFANA_URL:-}
      - GRAFANA_API_KEY=${GRAFANA_API_KEY:-}

      # Optional API integrations (uncomment what you use):
      # - STREAM_ALLOWED_ROOTS=/logs,/notebooks        # extra roots for /api/v1/streamfile (admin)
      # - AD_SERVER=ldap://dc1.example.com,ldap://dc2.example.com
      # - AD_DOMAIN=EXAMPLE
      # - AD_BASE_DN=DC=example,DC=com
      # - GROUP_ROLE_MAP={"NYX-Admins":"admin","NYX-Users":"user"}
      # - SQLSERVER_HOST=sqlhost
      # - SQLSERVER_LOGIN=nyx
      # - SQLSERVER_PASSWORD=change-me
      # - SQLSERVER_PORT=1433

      - PG_LOGIN=nyx
      - PG_PASSWORD=${PG_PASSWORD:?set PG_PASSWORD}
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=nyx      

    volumes:
      - '../logs/:/opt/sources/logs/'
      - "../generatedreports/rapi/:/opt/sources/outputs/"

################################################################################################

  nyx_lambda:
    # Built by nyx_containers/.github/workflows/build-lambda.yml (image snuids/nyx_lambda)
    image: snuids/nyx_lambda:v1.6.3
    container_name: nyx_lambda
    restart: always
    environment:
      - USE_LOGSTASH=true
      - AMQC_URL=amqc
      - AMQC_LOGIN=admin
      - AMQC_PASSWORD=${AMQC_PASSWORD:?set AMQC_PASSWORD}
      - AMQC_PORT=61613
      - RUNNER=2
      - ELK_URL=esnodebal
      - ELK_LOGIN=
      - ELK_PASSWORD=
      - ELK_PORT=9200
      - ELK_SSL=false
      - TZ=Europe/Paris
    volumes:
      - '../logs/:/opt/sources/logs/'
      - '../notebooks/Lambdas:/opt/sources/notebooks'

################################################################################################

  nyx_reportrunner_1:
    # Built by nyx_containers/.github/workflows/build-reportrunner.yml (image snuids/nyx-reportrunner)
    image: snuids/nyx-reportrunner:v1.9.29
    container_name: nyx_reportrunner_1
    restart: always
    environment:
      - USE_LOGSTASH=true
      - AMQC_URL=amqc
      - AMQC_LOGIN=admin
      - AMQC_PASSWORD=${AMQC_PASSWORD:?set AMQC_PASSWORD}
      - AMQC_PORT=61613

      - JDBC_DS=jdbc:elasticsearch://esnodebal:9200

      - ELK_URL=esnodebal
      - ELK_LOGIN=
      - ELK_PASSWORD=
      - ELK_PORT=9200
      - ELK_SSL=false
      - TZ=Europe/Paris
      - RUNNER=1
      - REPORT_URL=https://test2.nyx-ds.com/generatedreports
      # reportrunner >= 1.9.x renders jasper/jasper_jdbc reports through the
      # nyx_jasper_creator REST API and fetches datasources from the NYX API.
      - JASPER_API=${JASPER_API:-http://nyxjasper:8080/api/v1/generate-report}
      - DATA_SOURCE_API=${DATA_SOURCE_API:-http://nyx_restapi:8000/api/v1/datasource/}
      - GRAFANA_URL=${GRAFANA_URL:-}
      - GRAFANA_API_KEY=${GRAFANA_API_KEY:-}
      - GRAFANA_VERIFY_SSL=${GRAFANA_VERIFY_SSL:-true}
      - GRAFANA_TIMEOUT=${GRAFANA_TIMEOUT:-60}
      - GRAFANA_MAX_DATAPOINTS=${GRAFANA_MAX_DATAPOINTS:-1000}
      - GRAFANA_MAX_ROWS_PER_SHEET=${GRAFANA_MAX_ROWS_PER_SHEET:-100000}
    volumes:
      - '../logs/:/opt/sources/logs/'
      - '../generatedreports/:/opt/sources/generated/'
      - '../reportrunner/:/opt/sources/reports'

################################################################################################

  nyx_scheduler:
    image: snuids/nyx_reportscheduler:v1.0.9
    container_name: nyx_reportscheduler
    restart: always
    environment:
      - USE_LOGSTASH=true
      - AMQC_URL=amqc
      - AMQC_LOGIN=admin
      - AMQC_PASSWORD=${AMQC_PASSWORD:?set AMQC_PASSWORD}
      - AMQC_PORT=61613

      - ELK_URL=esnodebal
      - ELK_LOGIN=
      - ELK_PASSWORD=
      - ELK_PORT=9200
      - ELK_SSL=false
      - TZ=Europe/Paris
    volumes:
      - '../logs/:/opt/sources/logs/'
      - '../generatedreports/:/opt/sources/generated/'
      - '../reportrunner/:/opt/sources/reports'


################################################################################################
  amqc:
    image: snuids/activemq-amqcmonitoring:v6.3.3
#    image: snuids/activemq-amqcmonitoring:v5.15.2f
    ports:
#      - "8161:8161"
      - "61616:61616"
      - "61614:61614"
      - "61613:61613"
    container_name: amqc
    restart: always
    environment:
      - ACTIVEMQ_ADMIN_LOGIN=admin
      - ACTIVEMQ_ADMIN_PASSWORD=${AMQC_PASSWORD:?set AMQC_PASSWORD}

################################################


  nyx_rest_helper:
    image: snuids/nyx_rest_helper:v1.3.0
    container_name: nyx_rest_helper
    restart: always
    environment:
      - REDIS_IP=redis
      - USE_LOGSTASH=true
      - AMQC_URL=amqc
      - AMQC_LOGIN=admin
      - AMQC_PASSWORD=${AMQC_PASSWORD:?set AMQC_PASSWORD}
      - AMQC_PORT=61613

      - ELK_URL=esnodebal
      - ELK_LOGIN=
      - ELK_PASSWORD=
      - ELK_PORT=9200
      - ELK_SSL=false

      # v1.1.0 also serves /queue/REST_LOAD_PGDATA, which needs PostgreSQL access
      - PG_LOGIN=nyx
      - PG_PASSWORD=${PG_PASSWORD:?set PG_PASSWORD}
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=nyx

      - OUTPUT_FOLDER=./outputs/
      - OUTPUT_URL=https://app.nyx-ds.ovh/generatedreports/rapi/


      - SMTP_PORT=25
      - SMTP_USER=
      - SMTP_PASSWORD=
      - SMTP_ADDRESS=mysmtp
      - SMTP_FROM=noreply@nyx.com
      - SMTP_TLS=false
    volumes:
      - '../logs/:/opt/sources/logs/'
      - "../generatedreports/rapi/:/opt/sources/outputs/"


###########################

  curator:
    # Curator 8 reads an actionfile in the current format: the 5.x one (see ../curator/)
    # no longer loads.
    image: untergeek/curator:8.0.21
    container_name: curator
    volumes:
      - ../curator/action_file.yml:/usr/local/bin/action_file.yml
      - ../curator/curator_config.yml:/usr/local/bin/curator_config.yml 
 
###########################
  redis:
   image: redis:7.4.2
   container_name: redis

###########################
  camelworker1:
          #    image: snuids/camelworker:v1.14.0
    # camel4 replaces camelworker: volumes and variables to review before starting.
    image: snuids/camel4:v0.19
    container_name: camelworker1
    volumes:
      - ../camelworkers/camelworker1:/camelbin/conf
      - ../logs:/camelbin/logs
      - ../backup:/camelbin/backup
      - ../config_backup:/camelbin/config
      - ../reportrunner/generated:/camelbin/generated
    restart: always
    environment:
      - SITE_NAME=YOURSERVER
      # meme valeur que le tag de l image ci-dessus, sans le prefixe snuids/camel4:
      - CAMEL_WORKER_VERSION=v0.19
      - INSTANCE_NAME=NyxDemo
      - TZ=Europe/Paris
      - WORKFLOW_NAME=camelworker1
      - AMQC_PASSWORD=${AMQC_PASSWORD:?set AMQC_PASSWORD}
      - PG_PASSWORD=${PG_PASSWORD:?set PG_PASSWORD}
      - JAVA_OPTS=-XX:MetaspaceSize=128m -XX:MaxMetaspaceSize=256m -Xms256m -Xmx512m
      - _JAVA_OPTIONS=-XX:MetaspaceSize=128m -XX:MaxMetaspaceSize=256m -Xms256m -Xmx512m



