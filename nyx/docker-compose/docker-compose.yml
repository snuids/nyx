##############################
  esnodebal:
    # ES 8 refuses to start without xpack.security.enabled=false or TLS. The configuration
    # mounted from ../ELK/esnodebal/conf/ is still the 7.2 one, and the 7.x indices
    # have to be reindexed before moving to 8.x.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    restart: always
    container_name: esnodebal
    volumes:
      - "../ELK/esnodebal/conf/jvm.options:/usr/share/elasticsearch/config/jvm.options"
      - "../ELK/esnodebal/conf/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml"
      - "/home/nyx/elkdata/esnodebal/data:/usr/share/elasticsearch/data:rw"
      - "../sqlopendistro/:/usr/share/elasticsearch/plugins/sql"        
    logging:
      driver: json-file
      options:
        max-size: 50m
    ulimits:
      nofile:
         soft: 65536
         hard: 65536


##############################
  logstash:
    image: docker.elastic.co/logstash/logstash:7.2.0
    restart: always
    container_name: logstash
    volumes:
      - ../logstash/config:/usr/share/logstash/config
      - '../logs/:/var/log/logs/'
    command: logstash -f /usr/share/logstash/config/logstash.conf
    environment:
      - xpack.monitoring.enabled=false

##############################
# Services running in production but missing from this file until 02/11/2026.
# A deployment from this compose would have deleted them. The values are the production
# ones; secrets come from the environment, as elsewhere in this file.
##############################
  nyx_logs:
    image: snuids/nyx_logs:v1.3
    container_name: nyx_logs
    restart: always
    volumes:
      - ../logs:/logs


##############################
  nyx_ws_server:
    image: snuids/nyx_ws_server:v1.2.4
    container_name: nyx_ws_server
    restart: always
    environment:
      - USE_LOGSTASH=true
      - AMQC_URL=amqc
      - AMQC_LOGIN=admin
      - AMQC_PASSWORD=${AMQC_PASSWORD:?set AMQC_PASSWORD}
      - AMQC_PORT=1883
      - IN_TOPIC=TO_UI
      - "CONFIG=[{ 'name': 'UI', 'port': 8280 }]"

##############################
  nyx-jasper-creator:
    image: snuids/nyx-jasper-creator:1.0.21
    container_name: nyx-jasper-creator
    restart: always
    environment:
      - ACTIVEMQ_BROKER_URL=tcp://amqc:61616
      - ACTIVEMQ_USERNAME=admin
      - ACTIVEMQ_PASSWORD=${AMQC_PASSWORD:?set AMQC_PASSWORD}
      - ACTIVEMQ_QUEUE_NAME=NYX_CREATEJASPER
      - ACTIVEMQ_UPLOAD_QUEUE_NAME=JASPER_UPLOAD
      - ACTIVEMQ_STATUS_TOPIC=RPN_MODULE_INFO
      - STATUS_INTERVAL_SECONDS=5
      - MODULE_NAME=NYX_Jasper_Creator
      - JASPER_OUTPUT_DIRECTORY=reports
      - REST_API_ENABLED=true
      - REST_API_PORT=8080
    volumes:
      - ../reportrunner/generatedreports:/app/reports
      - ../jasper/jasperdef:/app/jasperdef
      - ../logs/jaspercreator/:/app/logs/

##############################
# Built from a local repository (/data/nyx/ssh-attacks) that is not part of
# this one: only the image is referenced here.

##############################
  postgres:
   # 11 -> 14: pg_upgrade (or dump/restore) mandatory, the data files of one
   # major version are not read by the next.
   image: postgres:14.17
   container_name: postgres
   ports:
     - 5444:5432
   volumes:
     - /home/nyxinstall/nyx/postgresqldata/data:/var/lib/postgresql/data
#     - pgdata:/var/lib/postgresql/data
#     - /etc/timezone:/etc/timezone
   environment:
     - POSTGRES_PASSWORD=${PG_PASSWORD:?set PG_PASSWORD}

     - TZ=Europe/Paris
