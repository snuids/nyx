version: '2'

# Components that run in production but are not part of the base stack:
#
#   ssh-attacks   collects the SSH intrusion attempts against the host, to map them.
#                 It is a server operations tool, not a piece of the platform.
#   nyx_controls  test-bench service.
#
# They are kept here so they are not lost again: their absence from this repository had
# already nearly made them disappear during a deployment. To start them with the stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.extras.yml up -d
#
# ssh-attacks is built from a local repository (/data/nyx/ssh-attacks) that is not part of
# this one, so only the image is referenced.

services:

##############################
  nyx_controls:
    image: snuids/nyx_controls:v1.5
    container_name: nyx_controls
    restart: always

##############################
  ssh-attacks:
    image: snuids/ssh-attacks:v1.0.0
    container_name: ssh-attacks
    restart: always
    environment:
      - ES_URL=http://elasticsearch:9200
      - AUTH_LOG=/var/log/auth.log
      - GEOIP_DB=/geolite2/GeoLite2-City.mmdb
      - GEOIP_ASN_DB=/geolite2/GeoLite2-ASN.mmdb
      - GEOIP_ONLINE=true
      - GEOIP_ONLINE_INTERVAL=5
      - INDEX_PREFIX=security_ssh_attacks
      - HOST_NAME=${HOST_NAME:-nyx}
      - POLL_SECONDS=5
      - START_FROM=beginning
    volumes:
      - /var/log:/var/log:ro
      - ../ssh-attacks/state:/state
      - ../ssh-attacks/geolite2:/geolite2:ro
